<html lang="en">

    <title>Jeo Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600&display=block">
  <style>
    /* Prevent FOUC - hide root until fonts load */
    html { background: #060b1a; }
    body { background: #060b1a; margin: 0; }
    #root { opacity: 0; transition: opacity 0.15s; }
    .fonts-loaded #root { opacity: 1; }
  </style>
    <script type="module" crossorigin src="/assets/index-B6ZhRIcq.js"></script>
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  <script>
    // Mark fonts as loaded to prevent FOUC
    document.fonts.ready.then(() => document.documentElement.classList.add('fonts-loaded'))
    // Fallback in case fonts.ready doesn't fire
    setTimeout(() => document.documentElement.classList.add('fonts-loaded'), 500)

    // Force service worker to check for updates on every page load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.update())
      })
      // If a new SW is waiting, claim it immediately
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload()
      })
    }
  </script>
  </body>
</html>
