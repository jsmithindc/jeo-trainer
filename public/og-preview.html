<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #060b1a;
    font-family: 'Barlow Condensed', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background: radial-gradient(ellipse at 50% -10%, #0d2070 0%, #060b1a 60%);
    overflow: hidden;
  }

  /* ── board grid — bottom half only ── */
  .board {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(6, 168px);
    grid-template-rows: repeat(5, 68px);
    gap: 6px;
    padding: 6px;
    z-index: 1;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 55%, rgba(0,0,0,0) 100%);
  }

  .cell {
    background: #0d1a60;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    color: #f5c518;
    opacity: 0.65;
    border: 1px solid rgba(30, 45, 120, 0.5);
  }

  /* subtle noise/scan texture */
  .scanlines {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.03) 3px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
  }

  /* vignette */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(3,5,14,0.65) 100%);
    pointer-events: none;
  }

  /* ── main content — above board ── */
  .content {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 72px;
  }

  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 7px;
    color: #4060a0;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 138px;
    line-height: 0.95;
    letter-spacing: 10px;
    color: #f5c518;
    text-shadow:
      0 0 80px rgba(245,197,24,0.2),
      0 3px 0 rgba(0,0,0,0.7),
      0 6px 32px rgba(245,197,24,0.12);
  }

  .divider {
    width: 420px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,197,24,0.5) 25%, rgba(245,197,24,0.5) 75%, transparent);
    margin: 26px 0 22px;
  }

  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 4px;
    color: #7080b0;
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .pills {
    display: flex;
    gap: 10px;
  }

  .pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #f5c518;
    border: 1px solid rgba(245,197,24,0.28);
    border-radius: 20px;
    padding: 6px 18px;
    background: rgba(245,197,24,0.07);
  }

  /* URL sits at bottom, above board cells */
  .url {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 4px;
    color: rgba(80, 100, 160, 0.8);
    text-transform: uppercase;
    white-space: nowrap;
    /* subtle backing so it reads over the board */
    text-shadow: 0 0 20px rgba(6,11,26,1), 0 0 40px rgba(6,11,26,0.8);
  }
</style>
</head>
<body>
<div class="canvas">

  <div class="board">
    <div class="cell">$200</div><div class="cell">$200</div><div class="cell">$200</div><div class="cell">$200</div><div class="cell">$200</div><div class="cell">$200</div>
    <div class="cell">$400</div><div class="cell">$400</div><div class="cell">$400</div><div class="cell">$400</div><div class="cell">$400</div><div class="cell">$400</div>
    <div class="cell">$600</div><div class="cell">$600</div><div class="cell">$600</div><div class="cell">$600</div><div class="cell">$600</div><div class="cell">$600</div>
    <div class="cell">$800</div><div class="cell">$800</div><div class="cell">$800</div><div class="cell">$800</div><div class="cell">$800</div><div class="cell">$800</div>
    <div class="cell">$1000</div><div class="cell">$1000</div><div class="cell">$1000</div><div class="cell">$1000</div><div class="cell">$1000</div><div class="cell">$1000</div>
  </div>

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="eyebrow">Jeopardy Study App</div>
    <div class="title">JEO TRAINER</div>
    <div class="divider"></div>
    <div class="tagline">Master the board. Study smarter.</div>
    <div class="pills">
      <div class="pill">Coryat Tracking</div>
      <div class="pill">Spaced Repetition</div>
      <div class="pill">Geography Drills</div>
    </div>
  </div>

  <div class="url">jeotrainer.jmvarghe.vip</div>
</div>
</body>
</html>
